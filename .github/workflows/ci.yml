name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - working-directory: backend
        run: python -m pytest core -q
      - working-directory: backend
        run: python -m compileall -q .
      - name: Build Python sandbox image
        run: docker build -t discovery-agent-python-sandbox:3.12 -f backend/sandbox/python/Dockerfile .
      - name: Validate generated Python connector in Docker sandbox
        working-directory: backend
        run: |
          python -c "from core.code_gen import generate_connector; from core.sandbox import validate_code_in_sandbox; a=generate_connector({'system_name':'Stripe','category':'Finance','auth_method':'API Key'}, 'python'); v=validate_code_in_sandbox(a); print(v); assert v['status'] == 'pass'; assert v.get('isolation') == 'docker'"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t discovery-agent-backend:ci -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -t discovery-agent-frontend:ci ./frontend
      - name: Validate Compose configuration
        run: docker compose config --quiet
