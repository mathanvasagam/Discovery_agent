services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DISCOVERY_CORS_ORIGINS: http://localhost:8080
      DISCOVERY_MAX_UPLOAD_BYTES: 20971520
      DISCOVERY_GROQ_API_KEY: ${DISCOVERY_GROQ_API_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
