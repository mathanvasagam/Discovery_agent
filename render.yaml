services:
  - type: web
    name: discovery-agent-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DISCOVERY_ENVIRONMENT
        value: production
      - key: DISCOVERY_DATABASE_URL
        sync: false
      - key: DISCOVERY_SESSION_SECRET
        generateValue: true
      - key: DISCOVERY_WORKSPACE_ISOLATION
        value: "true"
      - key: DISCOVERY_RATE_LIMIT_ENABLED
        value: "true"
      - key: DISCOVERY_RETAIN_UPLOADS
        value: "false"
      - key: DISCOVERY_VALIDATION_MODE
        value: static
      - key: DISCOVERY_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: DISCOVERY_ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: DISCOVERY_CORS_ORIGINS
        value: ""
      - key: DISCOVERY_LLM_PROVIDER_ORDER
        value: gemini,groq
      - key: DISCOVERY_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCOVERY_GROQ_API_KEY
        sync: false
